name: Feature request
description: Suggest a new capability or an extraction the parser is missing.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach real SSIS packages or production data.** Describe the
        SSIS construct generically, or supply a synthetic snippet.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that you can't do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the output or interface look like?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: no-real-data
    attributes:
      label: Confirmation
      options:
        - label: I have confirmed this request contains no real or confidential data.
          required: true
