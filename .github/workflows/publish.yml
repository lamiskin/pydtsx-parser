name: Publish

on:
  release:
    types: [published]
  # Manual dry run: builds, validates, and can publish to TestPyPI only.
  # Real PyPI is unreachable from this trigger by design.
  workflow_dispatch:
    inputs:
      target:
        description: "Dry-run target"
        type: choice
        options: [none, testpypi]
        default: none

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build distributions
        run: uv build
      - name: Validate distribution metadata
        run: uvx twine check --strict dist/*
      - name: Smoke-test the built wheel
        # Catches a wheel that builds but cannot be installed or imported —
        # missing py.typed, a broken entry point, a package left out of the build.
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/pydtsx-parser --help
          /tmp/smoke/bin/python -c "import pydtsx_parser; from pydtsx_parser.dispatcher import dispatch"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    # Pre-release GitHub Releases, and manual dry runs, go to TestPyPI.
    if: >-
      ${{ (github.event_name == 'release' && github.event.release.prerelease)
          || (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') }}
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  pypi:
    # Full releases go to real PyPI. Never reachable from workflow_dispatch.
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
